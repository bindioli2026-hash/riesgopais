name: Diagnóstico temporal de fuentes

on:
  push:
    paths: ['.github/workflows/diagnostico-fuentes.yml']
  workflow_dispatch:

permissions: {}

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Hora de referencia
        run: TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d %H:%M %Z'
      - name: Ámbito variacion (en vivo)
        run: |
          curl -sS -m 20 -D - -A 'riesgopais-ar/1.1 (www.riesgopais.ar)' 'https://mercados.ambito.com/riesgopais/variacion' | head -c 3000; echo
      - name: Ámbito historico-general (últimos 12 días)
        run: |
          D=$(TZ=America/Argentina/Buenos_Aires date -d '12 days ago' '+%Y-%m-%d'); H=$(TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d')
          echo "GET $D -> $H"
          curl -sS -m 20 -D - -A 'riesgopais-ar/1.1 (www.riesgopais.ar)' "https://mercados.ambito.com/riesgopais/historico-general/$D/$H" | head -c 3000; echo
      - name: Rava página "hoy" (evaluación como respaldo)
        run: |
          curl -sS -m 20 -L -D - -A 'Mozilla/5.0 (compatible; riesgopais-ar/1.1)' 'https://www.rava.com/cotizaciones/historico/riesgo-pais/hoy/' -o rava.html; echo
          grep -o '"acceptedAnswer":{"text":"[^"]*"' rava.html | head -3
          grep -o -i 'actualizado al [^<]*' rava.html | head -3
          python3 - <<'EOF'
          import re
          h=open('rava.html',encoding='utf-8',errors='replace').read()
          print('bytes', len(h))
          for m in re.finditer(r'<tr>.*?</tr>', h, re.S):
              t=re.sub(r'<[^>]+>', ' ', m.group(0)); t=re.sub(r'\s+', ' ', t).strip()
              if re.search(r'\d{2}/\d{2}/\d{4}', t): print('fila:', t[:120])
          EOF

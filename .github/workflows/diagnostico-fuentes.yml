name: Diagnóstico temporal de fuentes

on:
  push:
    paths: ['.github/workflows/diagnostico-fuentes.yml']
  workflow_dispatch:

permissions: {}

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hora de referencia
        run: TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d %H:%M %Z'
      - name: Página de riesgo país de Ámbito (existe?)
        run: curl -sS -m 20 -o /dev/null -w 'HTTP %{http_code} %{url_effective}\n' -A 'Mozilla/5.0 (compatible; riesgopais-ar/1.2)' 'https://www.ambito.com/contenidos/riesgo-pais.html'
      - name: Simulación del actualizador con las fuentes reales
        run: python scripts/actualizar_riesgo_pais.py --simular
      - name: Simulación con Ámbito caído (respaldo Rava)
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, 'scripts')
          import actualizar_riesgo_pais as m
          original = m.descargar
          def sin_ambito(url, **kw):
              if 'ambito.com' in url:
                  raise OSError('simulado: Ámbito caído')
              return original(url, **kw)
          m.descargar = sin_ambito
          m.main(['--simular'])
          EOF
